name: Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create . --no-pub --platforms=android --org com.littlegamemaker --project-name little_game_maker

      - name: Install dependencies
        run: flutter pub get

      - name: Run automated tests
        run: flutter test

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.LITTLEGAMEMAKER_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.LITTLEGAMEMAKER_STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing repository secret: LITTLEGAMEMAKER_KEYSTORE_BASE64" >&2
            exit 1
          fi
          if [ -z "$STORE_PASSWORD" ]; then
            echo "Missing repository secret: LITTLEGAMEMAKER_STORE_PASSWORD" >&2
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release-signing.p12
          keytool -list -storetype PKCS12 -keystore android/app/release-signing.p12 -storepass:env STORE_PASSWORD -alias little-game-maker >/dev/null
          printf 'storePassword=%s\n' "$STORE_PASSWORD" > android/key.properties
          python3 .github/scripts/configure-signing.py
      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: little-game-maker-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties android/app/release-signing.p12
